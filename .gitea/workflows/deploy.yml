name: deploy

# Roll the freshly-published unstable RPMs onto the helexa fleet:
# cortex on the gateway, helexa-neuron-<flavour> on each neuron host,
# and helexa-bench on bob (the bench host).
#
# Triggered automatically after `build-prerelease` succeeds (by which
# point the new RPMs are live on rpm.lair.cafe/unstable), and also
# re-runnable manually from the Gitea UI.
#
# Each host self-gates: if dnf sees no newer package than what is
# installed, the service is left alone — no stop, no restart, no model
# cold-load. Combined with build-prerelease's change detection this
# means a docs- or gateway-only push never restarts the neurons (a
# neuron restart costs ~5 min of 27B cold-load, see issue #1).
#
# Per-host one-time setup (gitea_ci user, authorized_keys, scoped
# sudoers drop-in) lives in script/infra-setup.sh — run that once per
# host before this workflow can succeed.

on:
  workflow_run:
    workflows: [build-prerelease]
    types: [completed]
  workflow_dispatch:

# Serialize deploys. Overlapping runs would race on dnf metadata
# refresh and service-restart timing; queueing keeps the fleet
# predictable. Don't cancel an in-flight deploy — a half-applied dnf
# transaction is worse than a slightly stale deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_KEY: |
    ${{ secrets.RSYNC_SSH_KEY }}

jobs:
  # Gate the whole rollout on the two config files agreeing about every
  # model they both describe. models.toml (cortex, cold loads) and
  # asset/neuron/<host>.toml (resident models) each say how a model is
  # served — quant, and since #283 the sampling override. When they
  # disagree the model is served one way cold and another way resident,
  # which is #252.
  #
  # Deliberately a *gate*, not a step inside deploy-cortex: an
  # inconsistent pair must stop the neuron rollout too, and stopping it
  # before anything restarts is much cheaper than after (a beast restart
  # costs ~5-6 min of 27B cold-load).
  config-check:
    name: Config consistency
    runs-on: fedora-43
    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        || github.event.workflow_run.conclusion == 'success'
      }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 script/check-config-consistency.py

  deploy-cortex:
    needs: [config-check]
    runs-on: fedora-43
    # Two trigger paths: manual dispatch always runs; workflow_run
    # only runs if the upstream `build-prerelease` actually succeeded.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        || github.event.workflow_run.conclusion == 'success'
      }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH init
        run: |
          mkdir -p ~/.ssh
          echo "${DEPLOY_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new \
              gitea_ci@hanzalova.internal 'hostname -f'

      # The journal-capture step below needs to know whether this run
      # actually restarted the service. systemd mints a fresh
      # InvocationID on every start, so comparing before/after answers
      # that without depending on the deploy step's control flow.
      - name: Record cortex.service invocation
        id: pre
        run: |
          echo "inv=$(ssh gitea_ci@hanzalova.internal \
            'systemctl show -P InvocationID cortex.service' || true)" >> "$GITHUB_OUTPUT"

      # The catalogue is tracked (#283) precisely so it can be rolled out
      # here rather than hand-copied. Sync it *before* the package step,
      # so the restart that step performs is the one that picks it up —
      # and report whether it changed, because a catalogue edit with no
      # new RPM must still restart cortex or the change never takes
      # effect.
      #
      # Compared by digest rather than rsync's own change detection so the
      # answer is available to the shell that decides on the restart.
      - name: Sync gateway catalogue (models.toml)
        id: catalogue
        run: |
          local_sum=$(sha256sum models.toml | cut -d' ' -f1)
          remote_sum=$(ssh gitea_ci@hanzalova.internal \
            'sha256sum /etc/cortex/models.toml 2>/dev/null | cut -d" " -f1' || true)
          if [ "${local_sum}" = "${remote_sum}" ]; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "models.toml unchanged (${local_sum})"
          else
            rsync --archive --compress \
              --chown root:root --chmod 0644 \
              --rsync-path 'sudo rsync' \
              models.toml gitea_ci@hanzalova.internal:/etc/cortex/models.toml
            echo "changed=1" >> "$GITHUB_OUTPUT"
            echo "models.toml updated: ${remote_sum:-<absent>} -> ${local_sum}"
          fi

      # nginx vhost config for the internal site. Version-controlled in
      # `asset/nginx/` since the beginning, but until now only ever
      # installed by `script/infra-setup.sh` — a one-time, run-by-hand
      # script. So the repo copy and the live file could diverge with
      # nothing to detect it, which is the #252 shape: two sources of
      # truth for one thing and nothing forcing agreement.
      #
      # Writes to sites-available and (re)points sites-enabled at it as
      # a symlink. On this host sites-enabled was a *regular file*, not a
      # symlink — two independent copies, of which nginx reads one. An
      # operator editing "the config" would reasonably edit
      # sites-available, watch `nginx -t` pass, reload, and see nothing
      # change. Making the link canonical is part of the sync rather
      # than a separate chore, so the layout cannot drift back.
      #
      # `nginx -t` gates the reload: a config that fails validation is
      # left un-reloaded with the previous one still serving.
      - name: Sync internal nginx vhost
        run: |
          src="asset/nginx/helexa.internal.conf"

          # The sudoers drop-in that permits this is installed by
          # script/infra-setup.sh, which is run by hand. Check first, so
          # a missing permission reports the remedy instead of surfacing
          # as an opaque rsync failure.
          if ! ssh gitea_ci@hanzalova.internal 'sudo -n /usr/sbin/nginx -t' >/dev/null 2>&1; then
            echo "FAIL: gitea_ci lacks the nginx sudoers entries on hanzalova." >&2
            echo "      Re-run 'script/infra-setup.sh' once from an operator shell" >&2
            echo "      to install the updated asset/sudoers.d/cortex-host.conf." >&2
            exit 1
          fi

          rl="asset/nginx/helexa-ratelimit.conf"
          local_sum=$(sha256sum "${src}" | cut -d' ' -f1)
          local_rl=$(sha256sum "${rl}" | cut -d' ' -f1)
          remote_sum=$(ssh gitea_ci@hanzalova.internal \
            'sudo sha256sum /etc/nginx/sites-available/helexa.internal.conf 2>/dev/null | cut -d" " -f1' || true)
          remote_rl=$(ssh gitea_ci@hanzalova.internal \
            'sudo sha256sum /etc/nginx/conf.d/helexa-ratelimit.conf 2>/dev/null | cut -d" " -f1' || true)
          link_ok=$(ssh gitea_ci@hanzalova.internal \
            'test -L /etc/nginx/sites-enabled/helexa.internal.conf && echo yes || echo no')

          if [ "${local_sum}" = "${remote_sum}" ] \
             && [ "${local_rl}" = "${remote_rl}" ] \
             && [ "${link_ok}" = "yes" ]; then
            echo "nginx config unchanged, sites-enabled is a symlink — nothing to do"
            exit 0
          fi

          # Order matters: the vhost references names defined at http
          # context by helexa-ratelimit.conf (`limit_req_zone`s and the
          # `helexa_noquery` log format). Ship that first, or a vhost
          # referencing a not-yet-installed name fails `nginx -t` and the
          # deploy stops with the two files out of step.
          echo "syncing nginx rate-limit/log-format: ${remote_rl:-<absent>} -> ${local_rl}"
          rsync --archive --compress \
            --chown root:root --chmod 0644 \
            --rsync-path 'sudo rsync' \
            "${rl}" gitea_ci@hanzalova.internal:/etc/nginx/conf.d/helexa-ratelimit.conf

          echo "syncing nginx vhost: ${remote_sum:-<absent>} -> ${local_sum} (symlink=${link_ok})"
          rsync --archive --compress \
            --chown root:root --chmod 0644 \
            --rsync-path 'sudo rsync' \
            "${src}" gitea_ci@hanzalova.internal:/etc/nginx/sites-available/helexa.internal.conf

          ssh gitea_ci@hanzalova.internal 'bash -s' <<'NGINX'
          set -eu
          sudo /usr/bin/ln -sfn /etc/nginx/sites-available/helexa.internal.conf \
                                /etc/nginx/sites-enabled/helexa.internal.conf
          if ! sudo /usr/sbin/nginx -t; then
            echo "FAIL: nginx -t rejected the synced config; not reloading" >&2
            exit 1
          fi
          sudo /usr/bin/systemctl reload nginx
          echo "nginx reloaded"
          NGINX

      # Gating compares `rpm -q` against the packages.json manifest the
      # publish job maintains — NOT unprivileged `dnf check-update`,
      # which proved unreliable as the gitea_ci user (hung on metadata
      # locks on one host, silently reported "no updates" on others).
      # An unreadable/unparsable manifest fails open: deploy proceeds.
      - name: Deploy cortex (skips when already current)
        run: |
          ssh gitea_ci@hanzalova.internal 'bash -s' <<'DEPLOY'
          set -eu
          pkg=cortex
          # Default to 0 if the sync step somehow produced no output:
          # `set -u` plus `[ "" -eq 0 ]` would abort the deploy on an
          # arithmetic error rather than on anything meaningful.
          config_changed="${{ steps.catalogue.outputs.changed }}"
          config_changed="${config_changed:-0}"
          # `rpm -q` prints "package X is not installed" on STDOUT and exits
          # 1, so `|| echo not-installed` never fires — it captures the
          # message text instead. Test the exit code.
          if installed=$(rpm -q --qf '%{VERSION}-%{RELEASE}' "${pkg}" 2>/dev/null); then :; else
            installed="not-installed"
          fi
          latest=$(curl -fsS --max-time 15 "https://rpm.lair.cafe/fedora/43/x86_64/unstable/packages.json" 2>/dev/null \
            | python3 -c '
          import json, sys
          name = sys.argv[1]
          cands = [p for p in json.load(sys.stdin)["packages"] if p.get("name") == name]
          if cands:
              p = max(cands, key=lambda p: p.get("buildTime", 0))
              print(p["version"] + "-" + p["release"])
          ' "${pkg}" 2>/dev/null || true)
          # Skip only when BOTH the package and the catalogue are
          # unchanged — a models.toml edit (a new sampling override, a
          # corrected quant) must restart cortex even with no new RPM,
          # exactly as the neuron drop-in does below.
          if [ -n "${latest}" ] && [ "${latest}" = "${installed}" ] \
             && [ "${config_changed}" -eq 0 ]; then
            echo "${pkg}-${installed} already current; models.toml unchanged — leaving service untouched"
            exit 0
          fi
          pkg_changed=1
          if [ -n "${latest}" ] && [ "${latest}" = "${installed}" ]; then
            pkg_changed=0
          fi
          echo "installed=${installed} published=${latest:-unknown} pkg_changed=${pkg_changed} config_changed=${config_changed} — deploying"
          if systemctl is-active --quiet cortex.service; then
            sudo /usr/bin/systemctl stop cortex.service
          fi
          # A catalogue-only change still restarts, but must not spend a
          # dnf metadata refresh proving the package is already current.
          if [ "${pkg_changed}" -eq 1 ]; then
            if rpm -q "${pkg}" >/dev/null 2>&1; then
              sudo /usr/bin/dnf upgrade --refresh --allowerasing -y cortex
            else
              sudo /usr/bin/dnf install --refresh --allowerasing -y cortex
            fi
          fi
          sudo /usr/bin/systemctl daemon-reload
          # enable --now: start the service AND enable it for boot so the
          # fleet self-heals after a host reboot.
          sudo /usr/bin/systemctl enable --now cortex.service
          DEPLOY

      # Wait for the service to either come up or wedge, then capture
      # the journal for the invocation this run started. Runs even on
      # prior failure so a failed start step still leaves a usable
      # record in the deploy log.
      - name: Capture cortex.service startup journal
        if: always()
        env:
          PRE_INV: ${{ steps.pre.outputs.inv }}
        run: |
          sleep 10
          ssh gitea_ci@hanzalova.internal bash -s "${PRE_INV}" <<'CAPTURE'
          set -eu
          pre=${1:-}
          unit=cortex.service
          now=$(systemctl show -P InvocationID "${unit}")
          if [ -n "${now}" ] && [ "${now}" = "${pre}" ]; then
            echo "${unit} not restarted this run (invocation ${now}) — nothing to capture"
            systemctl status --no-pager --lines=0 "${unit}" || true
            exit 0
          fi
          # -I selects the latest invocation, which on a long-lived service
          # is unbounded — days of logs, hundreds of MB at debug level. Cap
          # the line count and drop the debug/trace firehose; startup lines
          # (and panics on stderr) are info and above. An empty invocation
          # id means the unit never came up, so drop -I and fall back to the
          # unit's recent tail, which is where the failure will be.
          timeout 60 journalctl --unit "${unit}" ${now:+-I} \
              --priority=info --lines=500 --no-pager \
            || { echo "(no info-level entries for this invocation, or capture timed out)"
                 systemctl status --no-pager --lines=0 "${unit}" || true; }
          CAPTURE

  deploy-neurons:
    needs: [config-check, deploy-cortex]
    runs-on: fedora-43
    strategy:
      # One neuron failing must not cancel the others. Cortex is up
      # already; a partial neuron deploy is strictly better than
      # rolling back to zero.
      fail-fast: false
      matrix:
        include:
          # load_timeout: how long to wait for default_models to finish
          # loading after a restart. beast cold-loads Qwen3.6-27B Q6K
          # TP=2 (~5-6 min typical, see #1); benjy/quadbrat load small
          # single-GPU models in well under a minute.
          #
          # max_prompt_tokens: per-model context cap, written to the
          # neuron.service.d/model.conf drop-in (NEURON_MAX_PROMPT_TOKENS).
          # A change here restarts the neuron even with no new RPM. Values
          # are VRAM-safe ceilings derived per model — see
          # doc/context-limits.md. beast (Qwen3.6-27B, hybrid linear, 2x
          # 32GB) has ample KV headroom; benjy (Qwen3-8B dense, ~6GB free)
          # is VRAM-bound and stays at the default; quadbrat (Qwen3-1.7B)
          # likewise conservative.
          - host: beast.hanzalova.internal
            flavour: blackwell
            load_timeout: 900
            max_prompt_tokens: 131072
          - host: benjy.hanzalova.internal
            flavour: ada
            load_timeout: 300
            max_prompt_tokens: 16384
          - host: quadbrat.hanzalova.internal
            flavour: ampere
            load_timeout: 300
            max_prompt_tokens: 16384
    steps:
      - uses: actions/checkout@v4
      - name: SSH init
        run: |
          mkdir -p ~/.ssh
          echo "${DEPLOY_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new \
              gitea_ci@${{ matrix.host }} 'hostname -f'

      # See deploy-cortex for why the capture step needs this.
      - name: Record neuron.service invocation
        id: pre
        run: |
          echo "inv=$(ssh gitea_ci@${{ matrix.host }} \
            'systemctl show -P InvocationID neuron.service' || true)" >> "$GITHUB_OUTPUT"

      # asset/neuron/<short>.toml is this host's neuron.toml. It carries
      # the resident-model specs — including the #283 sampling override,
      # which is inert until the daemon reloads the model, so a change
      # here has to restart the neuron the same way the context-cap
      # drop-in does.
      #
      # Synced before the package step so the restart that step performs
      # is the one that picks it up. Digest-compared rather than trusting
      # rsync's own change detection, because the restart decision needs
      # the answer and a needless neuron restart costs ~5-6 min of 27B
      # cold-load (#1).
      - name: Sync neuron config (${{ matrix.host }})
        id: neuronconf
        run: |
          short="${{ matrix.host }}"; short="${short%%.*}"
          src="asset/neuron/${short}.toml"
          if [ ! -f "${src}" ]; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "no ${src} in the repo — leaving this host's config alone"
            exit 0
          fi
          local_sum=$(sha256sum "${src}" | cut -d' ' -f1)
          remote_sum=$(ssh gitea_ci@${{ matrix.host }} \
            'sha256sum /etc/neuron/neuron.toml 2>/dev/null | cut -d" " -f1' || true)
          if [ "${local_sum}" = "${remote_sum}" ]; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "${src} unchanged (${local_sum})"
          else
            rsync --archive --compress \
              --chown root:root --chmod 0644 \
              --rsync-path 'sudo rsync' \
              "${src}" gitea_ci@${{ matrix.host }}:/etc/neuron/neuron.toml
            echo "changed=1" >> "$GITHUB_OUTPUT"
            echo "${src} updated: ${remote_sum:-<absent>} -> ${local_sum}"
          fi

      # See deploy-cortex for why gating uses the publish manifest and
      # not unprivileged `dnf check-update`.
      - name: Deploy helexa-neuron-${{ matrix.flavour }} (skips when already current)
        run: |
          ssh gitea_ci@${{ matrix.host }} 'bash -s' <<'DEPLOY'
          set -eu
          pkg=helexa-neuron-${{ matrix.flavour }}
          max_prompt_tokens="${{ matrix.max_prompt_tokens }}"
          # A neuron.toml change counts as a config change for the
          # restart decision below, exactly like the drop-in.
          neuron_toml_changed="${{ steps.neuronconf.outputs.changed }}"

          # ── Desired per-model systemd drop-in ─────────────────────────
          # model.conf carries NEURON_MAX_PROMPT_TOKENS so the context cap
          # is deterministic per host and rolled out (with a restart) by
          # this workflow, not hand-edited. It sorts after local.conf, so a
          # deploy-managed value wins over any manual local override of the
          # same variable. See doc/context-limits.md.
          conf=/etc/systemd/system/neuron.service.d/model.conf
          config_changed=${neuron_toml_changed:-0}
          if [ -n "${max_prompt_tokens}" ]; then
            desired=$(printf '%s\n%s\n%s\n%s' \
              "# Managed by .gitea/workflows/deploy.yml - do not edit by hand." \
              "# Per-model context cap; see doc/context-limits.md." \
              "[Service]" \
              "Environment=NEURON_MAX_PROMPT_TOKENS=${max_prompt_tokens}")
            [ "${desired}" = "$(cat "${conf}" 2>/dev/null || true)" ] || config_changed=1
          fi

          # ── Package version gate (manifest rationale: see deploy-cortex) ──
          # `rpm -q` prints "package X is not installed" on STDOUT and exits
          # 1, so `|| echo not-installed` never fires — it captures the
          # message text instead. Test the exit code.
          if installed=$(rpm -q --qf '%{VERSION}-%{RELEASE}' "${pkg}" 2>/dev/null); then :; else
            installed="not-installed"
          fi
          latest=$(curl -fsS --max-time 15 "https://rpm.lair.cafe/fedora/43/x86_64/unstable/packages.json" 2>/dev/null \
            | python3 -c '
          import json, sys
          name = sys.argv[1]
          cands = [p for p in json.load(sys.stdin)["packages"] if p.get("name") == name]
          if cands:
              p = max(cands, key=lambda p: p.get("buildTime", 0))
              print(p["version"] + "-" + p["release"])
          ' "${pkg}" 2>/dev/null || true)
          pkg_changed=1
          if [ -n "${latest}" ] && [ "${latest}" = "${installed}" ]; then
            pkg_changed=0
          fi

          # Skip only when BOTH the package and the drop-in are unchanged —
          # a context-cap change must restart the neuron even with no new RPM.
          if [ "${pkg_changed}" -eq 0 ] && [ "${config_changed}" -eq 0 ]; then
            echo "${pkg}-${installed} current; NEURON_MAX_PROMPT_TOKENS=${max_prompt_tokens:-<unset>} and neuron.toml unchanged — leaving service untouched"
            exit 0
          fi
          echo "installed=${installed} published=${latest:-unknown} pkg_changed=${pkg_changed} config_changed=${config_changed} — deploying"

          # Write the drop-in (staged in gitea_ci's dir, installed root-owned).
          # Guarded on max_prompt_tokens as well as config_changed: since
          # a neuron.toml change also sets config_changed, an entry with
          # no max_prompt_tokens would otherwise reach this with `desired`
          # unset.
          if [ "${config_changed}" -eq 1 ] && [ -n "${max_prompt_tokens}" ]; then
            printf '%s\n' "${desired}" > /var/lib/gitea_ci/model.conf
            sudo /usr/bin/install -o root -g root -m 0644 -D /var/lib/gitea_ci/model.conf "${conf}"
            rm -f /var/lib/gitea_ci/model.conf
            echo "applied ${conf}: NEURON_MAX_PROMPT_TOKENS=${max_prompt_tokens}"
          fi

          if systemctl is-active --quiet neuron.service; then
            sudo /usr/bin/systemctl stop neuron.service
          fi
          if [ "${pkg_changed}" -eq 1 ]; then
            if rpm -q "${pkg}" >/dev/null 2>&1; then
              sudo /usr/bin/dnf upgrade --refresh --allowerasing -y "${pkg}"
            else
              sudo /usr/bin/dnf install --refresh --allowerasing -y "${pkg}"
            fi
          fi
          # daemon-reload picks up both a new unit (dnf) and the drop-in.
          sudo /usr/bin/systemctl daemon-reload
          # enable --now: start the service AND enable it for boot so the
          # fleet self-heals after a host reboot.
          sudo /usr/bin/systemctl enable --now neuron.service

          # ── Post-deploy validation ────────────────────────────────
          # A deploy only goes green if the neuron (a) finishes loading
          # its default models and (b) answers a trivial prompt like an
          # LLM should. Catches the class of bug where the binary
          # starts fine but model load or inference is broken — which
          # previously surfaced only when a human noticed. The wait
          # polls /health activation (the structured source of the
          # "loaded default model" journal line, plus per-model failure
          # detail); the journal-capture step below still runs for
          # forensics either way.
          load_timeout=${{ matrix.load_timeout }}
          echo "waiting for default models (timeout ${load_timeout}s)"
          deadline=$(( $(date +%s) + load_timeout ))
          health=""
          while :; do
            health=$(curl -fsS --max-time 5 http://localhost:13131/health 2>/dev/null || true)
            state=$(printf %s "${health}" | python3 -c '
          import json, sys
          try:
              print(json.load(sys.stdin).get("activation", {}).get("state", ""))
          except Exception:
              print("")
          ')
            if [ "${state}" = "ready" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "FAIL: activation not ready within ${load_timeout}s (last state: ${state:-unreachable})"
              exit 1
            fi
            sleep 10
          done

          model=$(printf %s "${health}" | python3 -c '
          import json, sys
          a = json.load(sys.stdin).get("activation", {})
          failed = a.get("failed", [])
          if failed:
              for f in failed:
                  msg = "FAILED " + str(f.get("model_id")) + ": " + str(f.get("error", ""))[:400]
                  sys.stderr.write(msg + chr(10))
              sys.exit(1)
          completed = a.get("completed", [])
          print(completed[0] if completed else "")
          ')
          if [ -z "${model}" ]; then
            echo "no default models configured — skipping LLM probe"
            exit 0
          fi

          echo "LLM probe against ${model}"
          probe_body=$(printf '{"model":"%s","messages":[{"role":"user","content":"Reply with exactly one word: pineapple"}],"max_tokens":512,"temperature":0}' "${model}")
          # The probe races real traffic: a deploy publishes a new build
          # SHA, which is exactly what triggers helexa-bench to re-sweep
          # every scenario against this neuron — long capability-probe
          # generations can hold the batch-1 model for minutes. Admission
          # control answers concurrent requests with 429/503 +
          # Retry-After (#53/#63); treat those as "busy, try again", not
          # deploy failure. Overall budget ~6 min.
          probe_deadline=$(( $(date +%s) + 360 ))
          attempt=0
          while :; do
            attempt=$(( attempt + 1 ))
            hdrs=$(mktemp)
            resp=$(curl -sS --max-time 180 -D "${hdrs}" \
              -H "content-type: application/json" \
              -d "${probe_body}" http://localhost:13131/v1/chat/completions) || resp=""
            status=$(awk 'toupper($1) ~ /^HTTP/ {code=$2} END {print code}' "${hdrs}")
            retry_after=$(awk 'tolower($1) == "retry-after:" {print $2+0; exit}' "${hdrs}")
            rm -f "${hdrs}"
            if [ "${status}" = "200" ]; then
              if printf %s "${resp}" | grep -qi pineapple; then
                echo "LLM probe passed (attempt ${attempt})"
                break
              fi
              echo "FAIL: probe response missing expected token"
              printf %s "${resp}" | head -c 2000
              echo
              exit 1
            fi
            case "${status}" in
              429|503) ;;  # busy/queue-full — retryable
              *)
                echo "FAIL: probe request errored (HTTP ${status:-none})"
                printf %s "${resp}" | head -c 2000
                echo
                exit 1
                ;;
            esac
            if [ "$(date +%s)" -ge "${probe_deadline}" ]; then
              echo "FAIL: model still busy (HTTP ${status}) after probe budget"
              exit 1
            fi
            wait_s=${retry_after:-15}
            [ "${wait_s}" -ge 5 ] 2>/dev/null || wait_s=15
            echo "model busy (HTTP ${status}), retrying in ${wait_s}s (attempt ${attempt})"
            sleep "${wait_s}"
          done
          DEPLOY

      - name: Ensure firewalld allows helexa-neuron
        run: |
          ssh gitea_ci@${{ matrix.host }} '
            if ! sudo /usr/bin/firewall-cmd --query-service=helexa-neuron --quiet 2>/dev/null; then
              sudo /usr/bin/firewall-cmd --add-service=helexa-neuron --permanent
              sudo /usr/bin/firewall-cmd --reload
            fi'

      # Wait for the service to either come up or wedge, then capture
      # the journal for the invocation this run started. Runs even on
      # prior failure so a failed start step still leaves a usable
      # record in the deploy log. See deploy-cortex for the bounding
      # rationale — a neuron that has not restarted in a week is the
      # most exposed of the fleet to an unbounded -I.
      - name: Capture neuron.service startup journal
        if: always()
        env:
          PRE_INV: ${{ steps.pre.outputs.inv }}
        run: |
          sleep 10
          ssh gitea_ci@${{ matrix.host }} bash -s "${PRE_INV}" <<'CAPTURE'
          set -eu
          pre=${1:-}
          unit=neuron.service
          now=$(systemctl show -P InvocationID "${unit}")
          if [ -n "${now}" ] && [ "${now}" = "${pre}" ]; then
            echo "${unit} not restarted this run (invocation ${now}) — nothing to capture"
            systemctl status --no-pager --lines=0 "${unit}" || true
            exit 0
          fi
          timeout 60 journalctl --unit "${unit}" ${now:+-I} \
              --priority=info --lines=500 --no-pager \
            || { echo "(no info-level entries for this invocation, or capture timed out)"
                 systemctl status --no-pager --lines=0 "${unit}" || true; }
          CAPTURE

  # helexa-bench is a separate package on a separate host (bob), and it
  # only consumes the fleet's HTTP APIs — it has no deploy-ordering
  # dependency on cortex or the neurons (the sweep loop is version-aware
  # and picks up whatever each neuron reports whenever). So it runs
  # alongside the cortex→neurons chain rather than after it.
  # Roll helexa-router + helexa-upstream onto the federation service host
  # (gallumbits). Same manifest-gated dnf pattern as deploy-cortex; the
  # two services are independent daemons on one host, so one job handles
  # both. Configs are NOT synced here — they carry secrets and ride in
  # script/infra-setup.sh under the operator's own sudo.
  deploy-gallumbits:
    runs-on: fedora-43
    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        || github.event.workflow_run.conclusion == 'success'
      }}
    steps:
      - name: SSH init
        run: |
          mkdir -p ~/.ssh
          echo "${DEPLOY_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new \
              gitea_ci@gallumbits.kosherinata.internal 'hostname -f'

      # See deploy-cortex for why the capture step needs this. One
      # `unit=invocation` token per service; ssh flattens the list into
      # separate argv entries on the far side.
      - name: Record service invocations
        id: pre
        run: |
          echo "inv=$(ssh gitea_ci@gallumbits.kosherinata.internal '
            for u in helexa-router helexa-upstream helexa-tools helexa-angels; do
              printf "%s=%s " "${u}" "$(systemctl show -P InvocationID ${u}.service)"
            done' || true)" >> "$GITHUB_OUTPUT"

      - name: Deploy helexa-router + helexa-upstream + helexa-tools + helexa-angels (skips when already current)
        run: |
          ssh gitea_ci@gallumbits.kosherinata.internal 'bash -s' <<'DEPLOY'
          set -eu
          for pkg in helexa-router helexa-upstream helexa-tools helexa-angels; do
            # `rpm -q` prints "package X is not installed" on STDOUT and
            # exits 1, so `|| echo not-installed` never fires and the
            # sentinel below would never match. Test the exit code.
            if installed=$(rpm -q --qf '%{VERSION}-%{RELEASE}' "${pkg}" 2>/dev/null); then :; else
              installed="not-installed"
            fi
            latest=$(curl -fsS --max-time 15 "https://rpm.lair.cafe/fedora/43/x86_64/unstable/packages.json" 2>/dev/null \
              | python3 -c '
          import json, sys
          name = sys.argv[1]
          cands = [p for p in json.load(sys.stdin)["packages"] if p.get("name") == name]
          if cands:
              p = max(cands, key=lambda p: p.get("buildTime", 0))
              print(p["version"] + "-" + p["release"])
          ' "${pkg}" 2>/dev/null || true)
            if [ -n "${latest}" ] && [ "${latest}" = "${installed}" ]; then
              echo "${pkg}-${installed} already current — leaving service untouched"
              continue
            fi
            # A package that has never been published AND is not installed
            # cannot be deployed — most often a new service whose first RPM
            # has not landed yet. Skip it rather than letting `dnf install`
            # fail: this loop runs under `set -e`, so one unpublished
            # newcomer would otherwise abort the whole host's deploy and
            # strand every package after it in the list.
            if [ -z "${latest}" ] && [ "${installed}" = "not-installed" ]; then
              echo "${pkg}: not published yet and not installed — skipping"
              continue
            fi
            echo "${pkg}: installed=${installed} published=${latest:-unknown} — deploying"
            if systemctl is-active --quiet "${pkg}.service"; then
              sudo /usr/bin/systemctl stop "${pkg}.service"
            fi
            if rpm -q "${pkg}" >/dev/null 2>&1; then
              sudo /usr/bin/dnf upgrade --refresh --allowerasing -y "${pkg}"
            else
              sudo /usr/bin/dnf install --refresh --allowerasing -y "${pkg}"
            fi
            sudo /usr/bin/systemctl daemon-reload
            sudo /usr/bin/systemctl enable --now "${pkg}.service"
          done
          DEPLOY

      - name: Ensure firewalld allows helexa-router + helexa-upstream + helexa-tools + helexa-angels
        run: |
          ssh gitea_ci@gallumbits.kosherinata.internal '
            changed=0
            for svc in helexa-router helexa-upstream helexa-tools helexa-angels; do
              if ! sudo /usr/bin/firewall-cmd --query-service=${svc} --quiet 2>/dev/null; then
                sudo /usr/bin/firewall-cmd --add-service=${svc} --permanent
                changed=1
              fi
            done
            [ "$changed" = "1" ] && sudo /usr/bin/firewall-cmd --reload || true
          '

      # Per-unit: capture only the invocation this run started, bounded.
      # See deploy-cortex for the rationale.
      - name: Capture service startup journals
        if: always()
        env:
          PRE_INV: ${{ steps.pre.outputs.inv }}
        run: |
          sleep 10
          ssh gitea_ci@gallumbits.kosherinata.internal bash -s "${PRE_INV}" <<'CAPTURE'
          set -eu
          for spec in "$@"; do
            u=${spec%%=*}
            pre=${spec#*=}
            unit=${u}.service
            echo "── ${unit} ──"
            now=$(systemctl show -P InvocationID "${unit}")
            if [ -n "${now}" ] && [ "${now}" = "${pre}" ]; then
              echo "${unit} not restarted this run (invocation ${now}) — nothing to capture"
              systemctl status --no-pager --lines=0 "${unit}" || true
              continue
            fi
            timeout 60 journalctl --unit "${unit}" ${now:+-I} \
                --priority=info --lines=500 --no-pager \
              || { echo "(no info-level entries for this invocation, or capture timed out)"
                 systemctl status --no-pager --lines=0 "${unit}" || true; }
          done
          CAPTURE

  deploy-bench:
    needs: [config-check]
    runs-on: fedora-43
    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        || github.event.workflow_run.conclusion == 'success'
      }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH init
        run: |
          mkdir -p ~/.ssh
          echo "${DEPLOY_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new \
              gitea_ci@bob.hanzalova.internal 'hostname -f'

      # See deploy-cortex for why the capture step needs this.
      - name: Record helexa-bench.service invocation
        id: pre
        run: |
          echo "inv=$(ssh gitea_ci@bob.hanzalova.internal \
            'systemctl show -P InvocationID helexa-bench.service' || true)" >> "$GITHUB_OUTPUT"

      # Same contract as the gateway and neuron configs: the repo is the
      # only writer, so a config edit must reach the host and restart the
      # service even when no new RPM landed.
      - name: Sync bench config
        id: benchconf
        run: |
          src="asset/helexa-bench/bob.toml"
          local_sum=$(sha256sum "${src}" | cut -d' ' -f1)
          remote_sum=$(ssh gitea_ci@bob.hanzalova.internal \
            'sha256sum /etc/helexa-bench/helexa-bench.toml 2>/dev/null | cut -d" " -f1' || true)
          if [ "${local_sum}" = "${remote_sum}" ]; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "${src} unchanged (${local_sum})"
          else
            rsync --archive --compress \
              --chown root:root --chmod 0644 \
              --rsync-path 'sudo rsync' \
              "${src}" gitea_ci@bob.hanzalova.internal:/etc/helexa-bench/helexa-bench.toml
            echo "changed=1" >> "$GITHUB_OUTPUT"
            echo "${src} updated: ${remote_sum:-<absent>} -> ${local_sum}"
          fi

      # See deploy-cortex for why gating uses the publish manifest and
      # not unprivileged `dnf check-update`.
      - name: Deploy helexa-bench (skips when already current)
        run: |
          ssh gitea_ci@bob.hanzalova.internal 'bash -s' <<'DEPLOY'
          set -eu
          pkg=helexa-bench
          config_changed="${{ steps.benchconf.outputs.changed }}"
          config_changed="${config_changed:-0}"
          # `rpm -q` prints "package X is not installed" on STDOUT and exits
          # 1, so `|| echo not-installed` never fires — it captures the
          # message text instead. Test the exit code.
          if installed=$(rpm -q --qf '%{VERSION}-%{RELEASE}' "${pkg}" 2>/dev/null); then :; else
            installed="not-installed"
          fi
          latest=$(curl -fsS --max-time 15 "https://rpm.lair.cafe/fedora/43/x86_64/unstable/packages.json" 2>/dev/null \
            | python3 -c '
          import json, sys
          name = sys.argv[1]
          cands = [p for p in json.load(sys.stdin)["packages"] if p.get("name") == name]
          if cands:
              p = max(cands, key=lambda p: p.get("buildTime", 0))
              print(p["version"] + "-" + p["release"])
          ' "${pkg}" 2>/dev/null || true)
          if [ -n "${latest}" ] && [ "${latest}" = "${installed}" ] \
             && [ "${config_changed}" -eq 0 ]; then
            echo "${pkg}-${installed} already current; config unchanged — leaving service untouched"
            exit 0
          fi
          pkg_changed=1
          if [ -n "${latest}" ] && [ "${latest}" = "${installed}" ]; then
            pkg_changed=0
          fi
          echo "installed=${installed} published=${latest:-unknown} pkg_changed=${pkg_changed} config_changed=${config_changed} — deploying"
          if systemctl is-active --quiet helexa-bench.service; then
            sudo /usr/bin/systemctl stop helexa-bench.service
          fi
          if [ "${pkg_changed}" -eq 1 ]; then
            if rpm -q "${pkg}" >/dev/null 2>&1; then
              sudo /usr/bin/dnf upgrade --refresh --allowerasing -y helexa-bench
            else
              sudo /usr/bin/dnf install --refresh --allowerasing -y helexa-bench
            fi
          fi
          sudo /usr/bin/systemctl daemon-reload
          # enable --now: start the service AND enable it for boot so the
          # bench resumes collecting after a host reboot.
          sudo /usr/bin/systemctl enable --now helexa-bench.service

          # ── Post-deploy validation ────────────────────────────────
          # The bench serves a read-only API on :13132 alongside the
          # outbound sweep loop. Probe the API over localhost (bypasses
          # firewalld) — catches a crash-on-start or a bad bind. Bail
          # early if the unit drops out of active (Restart backoff).
          echo "waiting for bench API on :13132"
          deadline=$(( $(date +%s) + 30 ))
          while :; do
            if curl -fsS --max-time 5 http://localhost:13132/api/health >/dev/null 2>&1; then
              echo "bench API healthy"
              break
            fi
            if ! systemctl is-active --quiet helexa-bench.service; then
              echo "FAIL: helexa-bench.service is not active"
              systemctl --no-pager status helexa-bench.service | head -20 || true
              exit 1
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "FAIL: bench API not healthy within 30s"
              exit 1
            fi
            sleep 3
          done
          DEPLOY

      - name: Ensure firewalld allows helexa-bench
        run: |
          ssh gitea_ci@bob.hanzalova.internal '
            if ! sudo /usr/bin/firewall-cmd --query-service=helexa-bench --quiet 2>/dev/null; then
              sudo /usr/bin/firewall-cmd --add-service=helexa-bench --permanent
              sudo /usr/bin/firewall-cmd --reload
            fi'

      # Wait for the service to either come up or wedge, then capture
      # the journal for the invocation this run started. Runs even on
      # prior failure so a failed start step still leaves a usable
      # record in the deploy log. See deploy-cortex for the bounding
      # rationale.
      - name: Capture helexa-bench.service startup journal
        if: always()
        env:
          PRE_INV: ${{ steps.pre.outputs.inv }}
        run: |
          sleep 10
          ssh gitea_ci@bob.hanzalova.internal bash -s "${PRE_INV}" <<'CAPTURE'
          set -eu
          pre=${1:-}
          unit=helexa-bench.service
          now=$(systemctl show -P InvocationID "${unit}")
          if [ -n "${now}" ] && [ "${now}" = "${pre}" ]; then
            echo "${unit} not restarted this run (invocation ${now}) — nothing to capture"
            systemctl status --no-pager --lines=0 "${unit}" || true
            exit 0
          fi
          timeout 60 journalctl --unit "${unit}" ${now:+-I} \
              --priority=info --lines=500 --no-pager \
            || { echo "(no info-level entries for this invocation, or capture timed out)"
                 systemctl status --no-pager --lines=0 "${unit}" || true; }
          CAPTURE

  # Build the bench UI and publish it to the public nginx vhost on the
  # gateway (https://bench.helexa.ai). The vhost + Let's Encrypt cert are
  # one-time host setup (script/infra-setup.sh); this job just refreshes
  # the static assets. nginx reverse-proxies /api to the bob API, so the
  # SPA is built same-origin (no VITE_API_BASE). Independent of the other
  # deploy jobs.
  deploy-bench-ui:
    runs-on: fedora-43
    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        || github.event.workflow_run.conclusion == 'success'
      }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build UI
        run: |
          cd bench
          npm ci
          npm run build

      - name: SSH init
        run: |
          mkdir -p ~/.ssh
          echo "${DEPLOY_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new \
              gitea_ci@hanzalova.internal 'hostname -f'

      - name: Rsync built UI to gateway webroot
        run: |
          rsync --archive --compress --delete \
            --rsync-path 'sudo rsync' \
            bench/dist/ \
            gitea_ci@hanzalova.internal:/var/www/bench.helexa.ai/

  # Build the helexa.ai website and publish it to the public nginx
  # vhosts on BOTH edge proxies (oolon.kosherinata.internal for the DC
  # site, hanzalova.internal for the office site). Cloudflare DNS load
  # balancing routes helexa.ai to the two site WAN IPs; mesh clients use
  # https://helexa.internal (hanzalova only). The vhosts + certs are
  # one-time host setup (script/infra-setup.sh); this job just
  # refreshes the static assets. Independent of the other deploy jobs.
  deploy-website:
    runs-on: fedora-43
    if: >-
      ${{
        github.event_name == 'workflow_dispatch'
        || github.event.workflow_run.conclusion == 'success'
      }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build website
        run: |
          cd helexa.ai
          npm ci
          npm run i18n:check
          npm run build

      - name: SSH init
        run: |
          mkdir -p ~/.ssh
          echo "${DEPLOY_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for host in hanzalova.internal oolon.kosherinata.internal; do
            ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new \
                "gitea_ci@${host}" 'hostname -f'
          done

      # Both proxies serve the same build; a failed rsync to one host
      # fails the job (Cloudflare LB health checks paper over a stale
      # instance, but the job exit code should still tell the truth).
      - name: Rsync built site to edge webroots
        run: |
          for host in hanzalova.internal oolon.kosherinata.internal; do
            rsync --archive --compress --delete \
              --rsync-path 'sudo rsync' \
              helexa.ai/dist/ \
              "gitea_ci@${host}:/var/www/helexa.ai/"
          done

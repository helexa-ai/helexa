# models.toml — helexa fleet catalogue
#
# Operator-owned and **tracked in git** (#283). It carries no secrets —
# cortex.toml holds the API keys — and CI needs to see it: this file and
# `asset/neuron/<host>.toml` both describe how a model is served, and
# nothing forced them to agree until `script/check-config-consistency.py`
# began gating on it. That gap is what #252 was.
#
# Deployed to the gateway by `.gitea/workflows/deploy.yml`, which is the
# ONLY writer (operator decision 2026-08-25). Editing
# /etc/cortex/models.toml on the host by hand is pointless — the next
# deploy overwrites it from this file — and dangerous, because until it
# does, the fleet is running something no commit describes.
#
# Fleet shape (sourced from asset/manifest.yml):
#   beast      = 2x RTX 5090 (32 GB each)  → tp-2 capable
#   benjy      = 1x RTX 4090 (24 GB)        → large single-GPU
#   quadbrat   = 1x RTX 3060 (12 GB)        → small / quantised

# Qwen3-Next single-GPU validation target (Stage 8c). Same architecture
# as Qwen3.6-27B (`model_type = "qwen3_5"`, same layer_types pattern,
# same Gated DeltaNet hyperparams) but small enough to fit on any
# fleet GPU in bf16 (~1.6 GB). Stepping stone — if this answers the
# Tbilisi probe correctly, the qwen3_5 code path is right and TP-2 on
# Qwen3.6-27B is purely a sharding/collective problem.
[[models]]
id = "Qwen/Qwen3.5-0.8B"
harness = "candle"
vram_mb = 2000
min_devices = 1
min_device_vram_mb = 4000
# Illustrative pricing (USD per 1M tokens). helexa has no paying customers
# yet; these differ per model purely to validate spend surfaces in clients.
cost.input = 0.02
cost.output = 0.08

# Frontier MoE target (epic #84, F2 #93): 80B total / 3B active,
# 512 experts / 10 active + shared expert, same Gated DeltaNet hybrid
# as the 27B. Weights ~45 GB @ Q4_K_M ISQ under TP-2 (~22.5 GB/GPU) —
# beast only, and NOT co-resident with the 27B (cold-swap per F4e #99).
# The serving quant belongs HERE as well as on any load request (#252):
# a cortex cold-load builds its spec from this file, and without it the
# model loads unquantised — ~149 GB, which cannot fit beast at all.
# tensor_parallel is derived from min_devices, so only quant is needed.
[[models]]
id = "Qwen/Qwen3-Coder-Next"
harness = "candle"
quant = "q4k"
vram_mb = 46000
min_devices = 2
min_device_vram_mb = 24000
# Shares the big-node class with the flagship: either may cold-swap the
# other off beast (#99), in both directions, so a comparison between
# them can move traffic each way on demand.
residency_priority = 300
# Illustrative pricing (USD per 1M tokens) — frontier tier.
cost.input = 0.40
cost.output = 1.60

# Thinking sibling of Coder-Next (same 80B-A3B arch) — on beast for the
# F3 A/B evaluation (#94); one of the two frontier variants competes for
# residency, the other stays cold-loadable.
[[models]]
id = "Qwen/Qwen3-Next-80B-A3B-Thinking"
harness = "candle"
quant = "q4k"
vram_mb = 46000
min_devices = 2
min_device_vram_mb = 24000
# Shares the big-node class with the flagship: either may cold-swap the
# other off beast (#99), in both directions, so a comparison between
# them can move traffic each way on demand.
residency_priority = 300
# Illustrative pricing (USD per 1M tokens) — frontier tier.
cost.input = 0.40
cost.output = 1.60

# Tensor-parallel target. Beast is the only neuron with two big GPUs.
[[models]]
id = "Qwen/Qwen3.6-27B"
harness = "candle"
# REQUIRED, not cosmetic (#252). Without it a cortex cold-load builds an
# unquantised request: the model loads bf16, leaves ~2 GB free per card
# against a ~3.9 GB prefill requirement, reports `loaded`, and then fails
# every request. Activation from neuron's default_models has always said
# q6k; this is the same fact on the path cortex uses.
quant = "q6k"
# Measured q6k residency across the pair (17.9 + 22.9 GB), not the 51.7 GB
# bf16 checkpoint size. The old 54000 described a model we do not serve.
vram_mb = 42000
min_devices = 2
min_device_vram_mb = 24000
pinned_on = ["beast"]
# The big-node class. Above the everyday class, so image generation can
# never take beast however idle the flagship is; equal to the frontier
# tier, so those two swap freely. `pinned_on` here is affinity only --
# it no longer implies immunity, so this number is what protects it.
residency_priority = 300
# Illustrative pricing (USD per 1M tokens) — top tier, the 27B flagship.
cost.input = 0.30
cost.output = 1.20
# DELIBERATE, TEMPORARY operator override (issue #67): unblocks the opencode
# helexa-provider implementation by giving /v1/models a limit to consume on
# beast. Mirrors the enforced NEURON_MAX_PROMPT_TOKENS=131072 there.
# To be REMOVED once neuron self-derives these — its removal is the
# acceptance test that the computed values replace this hand-set one.
#limit.context = 131072
#limit.input = 122880
#limit.output = 8192

# Qwen3.8-27B (#251). Architecturally identical to the 3.6-27B — same
# model_type, same layer counts, same vision tower; the two configs
# differ only in `transformers_version` — so it serves through the same
# qwen3_5 TP path with the same KV arithmetic.
#
# Same residency class as the 3.6-27B *deliberately*: equal rank is what
# lets the two displace each other in BOTH directions, so whichever is
# asked for takes beast and the other can take it back. A higher number
# here would let this one claim the node permanently and make the
# comparison between them impossible.
[[models]]
id = "Qwen/Qwen3.8-27B"
harness = "candle"
quant = "q6k"
vram_mb = 42000
min_devices = 2
min_device_vram_mb = 24000
pinned_on = ["beast"]
residency_priority = 300
cost.input = 0.30
cost.output = 1.20

# Sampling override (#283). The model publishes `temperature = 1.0` in
# its generation_config.json, and honouring that (#272) is correct by
# default — but measured on this stack it produced a 20% structural-
# defect rate on ~2k-token code generation (4/20 samples failed
# `node --check` or dropped required exports) against 0/60 at
# temperature <= 0.6. Fisher exact one-sided p = 0.0031.
#
# Extrapolated at constant hazard that is a ~79% chance of at least one
# defect in a 15k-token file, which is why this model had never once
# completed the tower-defence task two cloud models did in ten minutes.
#
# 0.6 is Qwen's own published *inference* guidance for thinking mode —
# a number that lives in a model card no machine can read, which is
# exactly why it has to be set here by hand.
#
# Precedence is request > operator > model, so a caller that names a
# temperature still gets it. MUST match asset/neuron/beast.toml;
# script/check-config-consistency.py fails CI if it drifts.
[models.sampling]
temperature = 0.6

# Mid-size dense bf16 — fits on benjy (24 GB) or beast (32 GB ea.).
[[models]]
id = "Qwen/Qwen3-8B"
harness = "candle"
vram_mb = 18000
min_devices = 1
min_device_vram_mb = 16000
# Everyday class, shared with Z-Image — they take turns on benjy.
residency_priority = 200
# Illustrative pricing (USD per 1M tokens) — mid tier (helexa/balanced).
cost.input = 0.10
cost.output = 0.40

# Single-GPU dense bf16 — fits anywhere with ≥4 GB.
[[models]]
id = "Qwen/Qwen3-1.7B"
harness = "candle"
vram_mb = 4000
min_devices = 1
min_device_vram_mb = 4000
# Illustrative pricing (USD per 1M tokens) — small tier (helexa/small).
cost.input = 0.04
cost.output = 0.16

# Small GGUF quantised — runs on quadbrat (12 GB) without breaking a sweat.
[[models]]
id = "unsloth/Qwen3-0.6B-GGUF"
harness = "candle"
quant = "Q4_K_M"
vram_mb = 500
min_devices = 1
min_device_vram_mb = 4000
# Illustrative pricing (USD per 1M tokens) — cheapest, the tiny GGUF.
cost.input = 0.015
cost.output = 0.06

# -- Tier aliases ------------------------------------------------------------
# Clients can request inference against an alias and cortex transparently
# routes to the concrete model id below. Useful so client code can pick a
# latency/quality tier without hardcoding specific model ids — operators
# can swap the targets here without touching client config.
[aliases]
"helexa/small" = "Qwen/Qwen3-1.7B"
"helexa/balanced" = "Qwen/Qwen3-8B"
"helexa/large" = "Qwen/Qwen3.8-27B"
"helexa/image" = "Tongyi-MAI/Z-Image-Turbo"

# Text-to-image (#197/#203): Z-Image-Turbo, 6B S3-DiT + Qwen3-4B text
# encoder (runs on host CPU by default — see [harness.candle.image] in
# neuron.toml) + VAE. BF16 DiT+VAE resident ≈ 14.6 GB; fits benjy's
# 4090 via cold-swap with Qwen3-8B (operator decision 2026-07-29,
# #197). Not default-activated anywhere — cortex cold-loads it on
# first images request and the evictor swaps it back out under text
# pressure. Metered in megapixel-steps (#202), not tokens; the token
# cost fields deliberately stay unset.
[[models]]
id = "Tongyi-MAI/Z-Image-Turbo"
harness = "candle"
vram_mb = 15000
min_devices = 1
min_device_vram_mb = 20000
# Everyday class, shared with Qwen3-8B: an image request cold-swaps the
# 8B off benjy and the next text request swaps it straight back. Below
# the big-node class, so it can never take beast -- its device
# constraints alone would otherwise let it land there.
residency_priority = 200

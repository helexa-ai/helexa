# neuron.example.toml — example configuration
#
# Copy to /etc/neuron/neuron.toml and adjust for your environment.
#
# Environment variable overrides use NEURON_ prefix with __ separators:
#   NEURON_PORT=13131

port = 13131

# -- Harnesses ---------------------------------------------------------------
# Each [[harnesses]] entry enables an inference engine. Currently only
# "candle" is supported — it runs in-process and uses huggingface/candle
# for inference on local CUDA devices (or CPU when CUDA is unavailable).

[[harnesses]]
name = "candle"

# -- Candle harness settings -------------------------------------------------
# Optional tuning for the candle harness.

[harness.candle]
# HuggingFace cache directory for model weights.
#
# Resolution order (first hit wins):
#   1. `hf_cache` here in this file (applies to the synth `huggingface`
#      source only — see [harness.candle.sources.*] below for explicit
#      per-source paths).
#   2. `HF_HUB_CACHE` env var — same convention as the Python
#      `huggingface_hub` library, so an existing cache directory shared
#      with other tooling can be reused without per-tool config.
#   3. `HF_HOME` env var (cache appended as `$HF_HOME/hub`).
#   4. hf-hub's default (`~/.cache/huggingface/hub`).
#
# For per-host overrides (e.g. one neuron has an SSD with prefetched
# weights), prefer a systemd drop-in over editing this file:
#   /etc/systemd/system/neuron.service.d/local.conf:
#     [Service]
#     Environment=HF_HUB_CACHE=/archive/hf-cache
# hf_cache = "/var/lib/neuron/hf-cache"

# Default scheme applied to bare `org/name` model ids (those without a
# `scheme:` prefix). Defaults to "huggingface" when unset. Set to
# "helexa" to make `default_models = [{ model_id = "Helexa/Foo" }]`
# resolve via the helexa registry without prefixing every entry.
# default_source = "huggingface"

# Per-scheme source endpoints. Each scheme maps to an HF-compatible
# registry. The `huggingface` source is auto-synthesised when omitted;
# declare it explicitly here to override the endpoint, auth env, or
# cache dir.
#
# Endpoint resolution for the synthesised source (first hit wins):
#   1. `endpoint` in an explicit block below.
#   2. `HF_ENDPOINT` env var — the same convention the Python
#      `huggingface_hub` library uses, so a whole host can be pointed
#      at a mirror with one systemd drop-in and no config edit:
#        /etc/systemd/system/neuron.service.d/local.conf:
#          [Service]
#          Environment=HF_ENDPOINT=https://rf.internal
#          Environment=HF_TOKEN=...
#   3. `https://huggingface.co`.
#
# Note the mirror must speak the HF-compatible wire format (siblings
# listing at `/api/models/{org}/{name}`, blobs at
# `/{org}/{name}/resolve/{rev}/{path}`), and if it requires auth, the
# token comes from `auth_env` (default `HF_TOKEN`).
#
# [harness.candle.sources.huggingface]
# endpoint = "https://huggingface.co"
# auth_env = "HF_TOKEN"          # optional bearer token via env var
# cache_dir = "/archive3/llm-cache/huggingface"
#
# Add helexa (or any operator-run mirror speaking the HF-compatible
# wire format) by adding another sources entry. Caches are
# disambiguated per scheme so a mirror serving the same `org/name` as
# HF cannot collide on disk.
#
# [harness.candle.sources.helexa]
# endpoint = "https://registry.helexa.ai"
# auth_env = "HELEXA_TOKEN"
# cache_dir = "/archive3/llm-cache/helexa"

# -- Prefix KV cache ----------------------------------------------------------
# Reuse cache state across requests when a new prompt starts with the
# exact token sequence of a previous one (chat/agent workloads), so
# prefill only runs on the new suffix. Applies per loaded model, on
# architectures that expose their cache state (qwen3_5). Snapshots
# live in device memory: budget_mb is per loaded model and comes out
# of the same VRAM that serves inference.
#
# [harness.candle.prefix_cache]
# enabled = true
# budget_mb = 1024
# max_entries = 8

# -- Self-derived context limits (#67) ---------------------------------------
# neuron computes the most-efficient limit{context,input,output} that still
# allows coherent agentic performance, from model architecture + live free
# VRAM + a self-measured prefill throughput ceiling, advertises it on
# /models, and enforces it. The advertised limit tracks the resident model
# and rises automatically as efficiency work (e.g. prefix caching, #11)
# frees headroom or speeds prefill — no operator action. These defaults
# rarely need changing; raise target_prefill_latency_secs once prefix
# caching makes long-context re-prefill cheap.
#
# [harness.candle.context_limit]
# enabled = true
# target_prefill_latency_secs = 120.0     # coherence wall (longest prefill/turn)
# bootstrap_prefill_tok_per_sec = 800.0    # cold-start estimate until measured
# activation_headroom_mb = 2048            # per-card prefill activation reserve
# min_free_floor_mb = 1500                 # per-card free-VRAM floor to keep
# output_reserve_tokens = 8192             # generation reserve below the wall

# -- Default models ----------------------------------------------------------
# Models listed here are loaded automatically when the neuron service
# activates. Loading is sequential — a slow or failing entry doesn't
# block the rest of the fleet, but it does push out the time before
# neuron starts serving HTTP, so keep the list short. Operators can
# load additional models on demand via POST /models/load.
#
# Make sure data/neuron.service's TimeoutStartSec is generous enough to
# cover the slowest entry's first-time download + materialisation.

# [[default_models]]
# model_id = "Qwen/Qwen3-0.6B-GGUF"
# harness = "candle"
# quant = "Q4_K_M"
# devices = [0]
#
# Operator sampling override (#283) — optional, per model.
#
# By default neuron honours what the model published in its
# `generation_config.json`; that is the model authors' stated intent and
# is right most of the time. It is not always right for the workload you
# serve: Qwen3.8-27B publishes `temperature = 1.0`, which measured a 20%
# structural-defect rate on ~2k-token code generation against 0/60 at
# <= 0.6 (Fisher exact one-sided p = 0.0031).
#
# Precedence is request > operator > model > built-in fallback, so a
# caller that names a temperature still gets what it asked for; this only
# changes what a caller who names nothing receives. Each field overlays
# independently — setting `temperature` alone leaves the model's `top_p`
# and `top_k` in force.
#
# Deliberately explicit. neuron will never inspect a model and guess a
# "better" temperature: a guesser is a footgun, a number you wrote is not.
#
# If cortex can also cold-load this model, the same values must appear in
# its `models.toml` entry — `script/check-config-consistency.py` gates on
# that, because two files describing one model is how #252 happened.
#
# [default_models.sampling]
# temperature = 0.6
# top_p = 0.95
# top_k = 20

# Text-to-image serving (#198). Applies to diffusers-format image
# models (Z-Image family). All fields optional.
#[harness.candle.image]
# Where the ~8 GB Qwen3-4B text encoder runs. "cpu" (default) keeps it
# off the GPU entirely — required on 24 GB cards; "cuda" trades VRAM
# for faster prompt encoding on cards with headroom.
#te_device = "cpu"
# Pin the text encoder between generations. Defaults follow te_device:
# resident on cpu (system RAM), rebuilt per request on cuda (VRAM).
#te_resident = true
# Resolution ceiling per side; oversized requests are rejected before
# admission. Dimensions must be multiples of 16.
#max_dim = 2048

# Music generation layout (#385). Applies to ACE-Step pipelines. These
# describe this host's card, not the model, so the same model id can
# serve bf16 on a 24 GB card and q8 on an 8 GB one. All fields optional.
#[harness.candle.audio]
# In-situ q8_0 quantization of the DiT, text encoder and planner linear
# layers; quantized pipelines compute in f32. About 4.6 GB resident
# against 6.4 GB for bf16, with no planner loaded.
#quant = "q8_0"
# "f32" computes unquantized GPU components in f32 (cards without fast
# bf16). Dense f32 needs about 13 GB resident; on small cards use quant.
#compute = "bf16"
# Which planner LM to load: a snapshot subfolder, a repo id of its own
# ("ACE-Step/acestep-5Hz-lm-0.6B" for an 8 GB card), or "none".
#planner = "acestep-5Hz-lm-1.7B"
# Shorter songs than the model allows, for a card that runs out first.
#max_duration_secs = 240
# Treat the device as having this much memory for the pipeline (MiB);
# under a budget the VAE decodes in smaller chunks.
#vram_budget_mb = 8192
# Hold the rest of the card's free memory so a large card behaves like
# one of the budget's size. For rehearsing a small card; never in serving.
#enforce_vram_budget = false
# A copy of each music model on several cards, for a rig of identical
# cards: "per-device" (every card) or a list of device indices. Each copy
# renders one song at a time; cortex sees one model whose capacity is the
# number of copies. A model's own `replicas` in [[default_models]] wins.
#replicas = "per-device"
# Where each component runs: "gpu" (default) or "cpu".
#[harness.candle.audio.placement]
#text_encoder = "gpu"
#planner = "gpu"
#dit = "gpu"
#vae = "gpu"

# When this host is powered, for hosts that leave the mesh on a schedule
# (solar). /health announces the next dark window; cortex stops sending
# new work at its drain time and treats the absence as planned.
#[availability]
# UTC windows; one may wrap past midnight ("22:00-06:00").
#online = ["06:30-18:45"]
# Stop taking new work this long before each dark window (seconds). Make
# it longer than this host's longest job.
#drain_secs = 900
